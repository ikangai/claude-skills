<!-- kanban-body.html — spliced into rewritable.html's INLINE_DOC literal.
     This is the document the rwa runtime renders. The runtime supplies the
     base palette and typography (see seeds/rewritable.html); this body
     adds kanban-specific layout and the inline card renderer/dragger.

     Card data lives in the <script type="application/json"> block. Inline
     JS reads it, renders columns, handles drag-and-drop, and updates the
     JSON on drop. ⌘S (rwa commit) persists the document back into the file.

     The UI scaffolding (column headers, the script that renders) is wrapped
     in rwa-locked so the agent cannot trample it on /-instructions. The
     editable region is the cards JSON. -->

<style>
/* === kanban-product layout — sits on top of rwa's content stylesheet === */
:where(#rwa-doc-mount) article{max-width:none;margin:24px 24px 80px;padding:0;}
:where(#rwa-doc-mount) h1.kb-title{font-size:1.25rem;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;color:var(--gray-900);}
:where(#rwa-doc-mount) .kb-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-500);margin:0 0 24px;}

.kb-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;}
@media (max-width: 960px){.kb-board{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width: 560px){.kb-board{grid-template-columns:1fr;}}

.kb-col{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px;min-height:120px;display:flex;flex-direction:column;gap:8px;transition:background .15s,border-color .15s;}
.kb-col.is-dragover{background:var(--gray-100);border-color:var(--gray-400);}
.kb-col-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;border-bottom:1px solid var(--gray-200);}
.kb-col-name{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-600);}
.kb-col-count{font-family:var(--font-mono);font-size:10px;color:var(--gray-400);background:var(--white);padding:2px 8px;border-radius:100px;border:1px solid var(--gray-200);}

.kb-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:10px 12px;cursor:grab;transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:6px;border-left-width:3px;}
.kb-card:hover{border-color:var(--gray-300);box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.kb-card:active{cursor:grabbing;}
.kb-card.is-dragging{opacity:.4;transform:scale(.98);}
.kb-card[data-priority="high"]{border-left-color:var(--red);}
.kb-card[data-priority="medium"]{border-left-color:var(--yellow);}
.kb-card[data-priority="low"]{border-left-color:var(--blue);}
.kb-card[data-priority="none"]{border-left-color:var(--gray-300);}

.kb-card-title{font-size:13px;font-weight:500;color:var(--gray-900);line-height:1.35;word-wrap:break-word;}
.kb-card-desc{font-size:12px;color:var(--gray-600);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.kb-card-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px;}

.kb-chip{font-family:var(--font-mono);font-size:9px;letter-spacing:.3px;background:var(--gray-100);color:var(--gray-600);padding:2px 7px;border-radius:100px;text-transform:lowercase;}
.kb-chip.kb-chip-agent{background:var(--gray-900);color:var(--white);text-transform:none;letter-spacing:.5px;}
.kb-chip.kb-chip-id{background:var(--white);border:1px solid var(--gray-200);color:var(--gray-400);font-size:9px;}
/* model / effort / tokens — the per-card cost & attribution chips. Model and
   token chips keep real casing (GPT-5, 42.1k, 1.2M); duration is all-lower. */
.kb-chip.kb-chip-model{background:var(--white);border:1px solid var(--gray-300);color:var(--gray-800);text-transform:none;letter-spacing:.2px;}
.kb-chip.kb-chip-effort{background:var(--gray-100);color:var(--gray-700);}
.kb-chip.kb-chip-effort.kb-running{background:var(--white);border:1px solid var(--blue);color:var(--blue);}
.kb-chip.kb-chip-tokens{background:var(--gray-100);color:var(--gray-700);text-transform:none;}

.kb-empty{font-family:var(--font-mono);font-size:10px;color:var(--gray-300);text-align:center;padding:16px 8px;letter-spacing:.5px;}

.kb-help{margin:32px 0 0;padding:16px 18px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:11px;color:var(--gray-600);line-height:1.7;}
.kb-help b{font-weight:600;color:var(--gray-900);}
.kb-help code{background:var(--white);border:1px solid var(--gray-200);padding:1px 6px;border-radius:4px;color:var(--gray-800);font-size:10.5px;}
.kb-toggle{font-family:var(--font-mono);font-size:10.5px;background:var(--white);border:1px solid var(--gray-200);color:var(--gray-700);padding:1px 8px;border-radius:4px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.kb-toggle:hover{background:var(--gray-50);border-color:var(--gray-400);color:var(--gray-900);}
.kb-toggle[aria-pressed="true"]{background:var(--gray-900);color:var(--white);border-color:var(--gray-900);}
.kb-toggle[aria-pressed="true"]:hover{background:var(--gray-800);border-color:var(--gray-800);}
</style>

<article>

<!-- rwa:frozen:begin kanban-header -->
<h1 class="kb-title" data-rwa-id="kbttl001">Kanban</h1>
<p class="kb-sub" data-rwa-id="kbsub001">project board · ⌘S commits</p>
<!-- rwa:frozen:end kanban-header -->

<!-- rwa:frozen:begin kanban-board -->
<div class="kb-board">
  <div class="kb-col" data-status="todo">
    <div class="kb-col-head"><span class="kb-col-name">To Do</span><span class="kb-col-count" data-count="todo">0</span></div>

  </div>

<!-- rwa:frozen:end kanban-board -->

<!-- Cards live here. The agent and CLI both edit this JSON; the inline JS
     below reads it on every render and rebuilds the column DOM from it.
     Format: JSON array of card objects (see references/card-schema.md).
     Markers below are exact substrings that scripts/rwa_splice.py uses
     to locate this region — do not change them. -->
<script type="application/json" id="kanban-cards">
[]
</script>

<!-- rwa:frozen:begin kanban-runtime -->
<script>
(function () {
  if (window.__kb_init) return; // re-entry guard; renderDoc re-runs scripts
  window.__kb_init = true;

  const STATUSES = ['todo','in_progress','review','done'];
  const root = document;

  function readCards () {
    const el = root.getElementById('kanban-cards');
    if (!el) return [];
    try { return JSON.parse(el.textContent || '[]'); }
    catch (e) { console.warn('kanban: malformed cards JSON', e); return []; }
  }

  function writeCards (cards) {
    const el = root.getElementById('kanban-cards');
    if (!el) return;
    el.textContent = '\n' + JSON.stringify(cards, null, 2) + '\n';
  }

  function escHTML (s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function shortId (s) {
    if (!s) return '';
    // last segment of YYYY-MM-DD-slug ids, capped
    const m = String(s).match(/^\d{4}-\d{2}-\d{2}-(.+)$/);
    const tail = m ? m[1] : String(s);
    return tail.length > 22 ? tail.slice(0,22) + '…' : tail;
  }

  // ─── cost & attribution helpers (mirror scripts/rwa_splice.py) ────────
  // humanizeDuration/Tokens must format identically to list.sh so the board
  // and the CLI agree; applyEffortTransition must match apply_effort_transition
  // in rwa_splice.py so a human drag banks time the same way a CLI move does.
  function humanizeDuration (sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60), rm = m % 60;
    if (h < 24) return rm ? (h + 'h ' + rm + 'm') : (h + 'h');
    const d = Math.floor(h / 24), rh = h % 24;
    return rh ? (d + 'd ' + rh + 'h') : (d + 'd');
  }
  function humanizeTokens (n) {
    n = Math.max(0, Math.floor(Number(n) || 0));
    if (n < 1000) return String(n);
    const trim = x => String(x % 1 === 0 ? x : Math.round(x * 10) / 10);
    if (n < 1e6) { const k = n / 1000; return (k >= 100 ? Math.round(k) : trim(k)) + 'k'; }
    const mm = n / 1e6; return (mm >= 100 ? Math.round(mm) : trim(mm)) + 'M';
  }
  // Total effort so far = banked seconds + the current stint if the clock runs.
  function effectiveEffortSeconds (c, nowMs) {
    let base = Math.max(0, Math.floor(Number(c.effort_seconds) || 0));
    if (c.effort_started_at) {
      const started = Date.parse(c.effort_started_at);
      if (!isNaN(started)) base += Math.max(0, Math.floor((nowMs - started) / 1000));
    }
    return base;
  }
  // Bank/start the in_progress clock on a status change. Mutates c in place.
  function applyEffortTransition (c, oldStatus, newStatus, nowISO) {
    if (oldStatus === newStatus) return;
    const wasIp = oldStatus === 'in_progress';
    const nowIp = newStatus === 'in_progress';
    if (nowIp && !wasIp) {
      if (!c.effort_started_at) c.effort_started_at = nowISO;
    } else if (wasIp && !nowIp) {
      const started = Date.parse(c.effort_started_at);
      c.effort_started_at = null;
      if (!isNaN(started)) {
        const delta = Math.floor((Date.parse(nowISO) - started) / 1000);
        if (delta > 0) c.effort_seconds = (Math.max(0, Math.floor(Number(c.effort_seconds) || 0))) + delta;
      }
    }
  }

  function cardEl (c) {
    const pri = c.priority && ['high','medium','low'].includes(c.priority) ? c.priority : 'none';
    const tags = Array.isArray(c.tags) ? c.tags : [];
    const desc = c.description ? `<div class="kb-card-desc">${escHTML(c.description)}</div>` : '';
    const meta = [];
    if (c.assigned_to) meta.push(`<span class="kb-chip kb-chip-agent">${escHTML(c.assigned_to)}</span>`);
    if (c.model) meta.push(`<span class="kb-chip kb-chip-model">◇ ${escHTML(String(c.model))}</span>`);
    const eff = effectiveEffortSeconds(c, Date.now());
    if (eff > 0 || c.effort_started_at) {
      const running = c.effort_started_at ? ' kb-running' : '';
      meta.push(`<span class="kb-chip kb-chip-effort${running}" title="time in progress">⏱ ${escHTML(humanizeDuration(eff))}</span>`);
    }
    if (c.tokens != null && Number(c.tokens) > 0) {
      meta.push(`<span class="kb-chip kb-chip-tokens" title="tokens used">⛁ ${escHTML(humanizeTokens(c.tokens))}</span>`);
    }
    for (const t of tags.slice(0,4)) meta.push(`<span class="kb-chip">${escHTML(t)}</span>`);
    meta.push(`<span class="kb-chip kb-chip-id">${escHTML(shortId(c.id))}</span>`);
    return `<div class="kb-card" draggable="true" data-id="${escHTML(c.id)}" data-priority="${pri}">
      <div class="kb-card-title">${escHTML(c.title || '(untitled)')}</div>
      ${desc}
      <div class="kb-card-meta">${meta.join('')}</div>
    </div>`;
  }

  function render () {
    const cards = readCards();
    const byCol = { todo:[], in_progress:[], review:[], done:[] };
    for (const c of cards) {
      const s = STATUSES.includes(c.status) ? c.status : 'todo';
      byCol[s].push(c);
    }
    for (const s of STATUSES) {
      const body = root.querySelector(`.kb-col-body[data-drop="${s}"]`);
      const count = root.querySelector(`.kb-col-count[data-count="${s}"]`);
      if (!body) continue;
      const list = byCol[s];
      body.innerHTML = list.length
        ? list.map(cardEl).join('')
        : `<div class="kb-empty">— empty —</div>`;
      if (count) count.textContent = String(list.length);
    }
    bindDrag();
  }

  function bindDrag () {
    root.querySelectorAll('.kb-card').forEach(el => {
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('dragend', onDragEnd);
    });
    root.querySelectorAll('.kb-col').forEach(col => {
      col.addEventListener('dragover', onDragOver);
      col.addEventListener('dragleave', onDragLeave);
      col.addEventListener('drop', onDrop);
    });
  }

  let dragId = null;
  function onDragStart (e) {
    dragId = e.currentTarget.getAttribute('data-id');
    e.currentTarget.classList.add('is-dragging');
    try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {}
    e.dataTransfer.effectAllowed = 'move';
  }
  function onDragEnd (e) {
    e.currentTarget.classList.remove('is-dragging');
    dragId = null;
    root.querySelectorAll('.kb-col.is-dragover').forEach(c => c.classList.remove('is-dragover'));
  }
  function onDragOver (e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('is-dragover');
  }
  function onDragLeave (e) {
    if (!e.currentTarget.contains(e.relatedTarget)) {
      e.currentTarget.classList.remove('is-dragover');
    }
  }
  // The rwa runtime keeps the canonical doc string in IndexedDB and hydrates
  // the DOM from it on every page load — INLINE_DOC is only read the very
  // first time the file is opened. So any DOM-side mutation (drag, polling
  // merge) that doesn't reach IDB is lost on refresh; ⌘S also reads from IDB
  // via getDoc(), so a missing IDB write means even committing would save the
  // stale pre-mutation doc. Splice the new cards JSON into the IDB doc to
  // keep the model in sync with the view. Callers handle the dirty flag —
  // it's set on user-initiated edits (drag) but not on file-driven syncs.
  let persistChain = Promise.resolve();
  function persistDocToIdb () {
    persistChain = persistChain.then(persistDocToIdbInner).catch(err => {
      console.warn('kanban: failed to persist cards to IDB', err);
    });
    return persistChain;
  }
  async function persistDocToIdbInner () {
    if (!window.runtime || !window.runtime.id) return;
    const DB_NAME = 'rwa_' + window.runtime.id;
    const STORE = 'rwa_doc';
    const KEY = 'self';

    const db = await new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    try {
      const current = await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(KEY);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      if (typeof current !== 'string') return;

      // The IDB doc holds the runtime form of INLINE_DOC, where the template
      // literal's escapes have already been resolved — so the kanban-cards
      // closing tag appears as a literal script end-tag. Splice between the
      // opener and the next close. The backslash in CLOSE is intentional and
      // is consumed by the JS string literal at runtime — see the seed-level
      // comment in extractDiskCards for the same trick.
      const OPEN = '<script type="application/json" id="kanban-cards">';
      const CLOSE = '<\/script>';
      const oi = current.indexOf(OPEN);
      if (oi < 0) return;
      const bs = oi + OPEN.length;
      const ce = current.indexOf(CLOSE, bs);
      if (ce < 0) return;

      const el = root.getElementById('kanban-cards');
      const body = el ? (el.textContent || '\n[]\n') : '\n[]\n';
      const next = current.slice(0, bs) + body + current.slice(ce);
      if (next === current) return;

      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
        tx.objectStore(STORE).put(next, KEY);
      });
    } finally {
      try { db.close(); } catch (_) {}
    }
  }

  function markDirty () {
    const commitBtn = document.getElementById('rwa-st-commit');
    if (commitBtn) commitBtn.classList.add('dirty');
  }

  // ─── uncommitted-drag tracking ───────────────────────────────────────
  // A local drag updates the DOM + IDB but not the file (until ⌘S). We record
  // the ids of cards with an uncommitted local drag so a reload can pull in CLI
  // changes while preserving exactly those in-flight drags — see bootReconcile.
  // Tracking ids (not just a boolean) means a CLI move of some OTHER card still
  // comes through on reload; only the cards the human actually dragged hold
  // their local status. Cleared on commit (the drag has reached the file).
  //
  // This lives in sessionStorage, NOT localStorage: the set is only meaningful
  // across a reload within the SAME tab, and sessionStorage is exactly that —
  // per-tab and reload-surviving. localStorage is shared across every tab on
  // the board's origin, so two tabs each mid-drag would pollute each other's
  // merge (tab A would "preserve" a card tab B dragged and reject the file's
  // version of it). sessionStorage isolates them. We suffix the doc id so two
  // boards opened in one tab over time don't collide.
  function draggedKey () {
    return 'kb-dragged-' + ((window.runtime && window.runtime.id) || 'doc');
  }
  function getDraggedIds () {
    try { return new Set(JSON.parse(sessionStorage.getItem(draggedKey()) || '[]')); }
    catch (e) { return new Set(); }
  }
  function addDraggedId (id) {
    try {
      const s = getDraggedIds(); s.add(id);
      sessionStorage.setItem(draggedKey(), JSON.stringify([...s]));
    } catch (e) {}
  }
  function clearDraggedIds () {
    try { sessionStorage.removeItem(draggedKey()); } catch (e) {}
  }

  function onDrop (e) {
    e.preventDefault();
    const col = e.currentTarget;
    col.classList.remove('is-dragover');
    const newStatus = col.getAttribute('data-status');
    const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
    if (!id || !STATUSES.includes(newStatus)) return;
    const cards = readCards();
    const c = cards.find(x => x.id === id);
    if (!c || c.status === newStatus) return;
    const prevStatus = c.status;
    const nowISO = new Date().toISOString();
    c.status = newStatus;
    if (newStatus === 'in_progress' && !c.claimed_at) {
      c.claimed_at = nowISO;
    }
    // Bank/start the in_progress clock for this human drag, exactly as the
    // CLI does on a `kanban move` (apply_effort_transition in rwa_splice.py).
    applyEffortTransition(c, prevStatus, newStatus, nowISO);
    writeCards(cards);
    render();
    persistDocToIdb();
    markDirty();
    addDraggedId(id);
    // Opt-in: auto-commit on drop. Default is off — drags are drafts until
    // ⌘S, mirroring the rest of rwa. When the user has toggled auto-commit on
    // (via the footer button), every drop triggers runtime.commit() to write
    // the file immediately. Only meaningful on browsers with the File System
    // Access API; on Firefox/Safari, commit falls back to a download prompt
    // so we hide the toggle there (see autoCommitSupported).
    if (autoCommitEnabled() && window.runtime && typeof window.runtime.commit === 'function') {
      Promise.resolve(window.runtime.commit()).catch(err => {
        console.warn('kanban: auto-commit failed', err);
      });
    }
  }

  // ─── file → browser sync ─────────────────────────────────────────────
  // The rwa runtime hydrates the DOM from IndexedDB on every page load,
  // ignoring INLINE_DOC after the container's first-ever open. That means CLI
  // writes to board.html are invisible to an open browser tab until IDB is
  // re-synced. Two mechanisms close that loop:
  //
  //   1. bootReconcile() — runs once per page load, BEFORE the first paint.
  //      It reads the file's cards straight from the in-scope INLINE_DOC const
  //      (captured from the file at load time) and adopts them over stale IDB.
  //      This is what makes a reload / the ↻ button reflect the latest CLI
  //      writes. It needs no network and works on file://.
  //
  //   2. syncFromDisk() — a ~2.5s poll for live changes while the tab stays
  //      open. It reads the file via the File System Access handle (available
  //      after the first ⌘S) or fetch() (http(s) only), then three-way-merges
  //      against (a) what we saw last poll and (b) the current DOM. NOTE:
  //      Chrome blocks fetch() of file:// URLs, so on a fresh file:// open
  //      (before any commit) the poll has no source and is a no-op — the user
  //      reloads / clicks ↻ instead. Browser-side drag changes are preserved.

  const SYNC_POLL_MS = 2500;
  let lastSeenDisk = null;            // cards array, last successfully fetched
  let syncInFlight = false;

  function extractDiskCards (fileText) {
    // Locate INLINE_DOC template literal in the bootstrap.
    const marker = 'const INLINE_DOC = `';
    const i = fileText.indexOf(marker);
    if (i < 0) return null;
    const cs = i + marker.length;
    let j = cs;
    while (j < fileText.length) {
      if (fileText[j] === '\\') { j += 2; continue; }
      if (fileText[j] === '`') break;
      j++;
    }
    if (j >= fileText.length) return null;

    // Reverse escapeTL (in reverse application order). Order matters:
    //   <\/script first, then ${, then `, then backslash last.
    // (Backslashes in source above and below are deliberate: they keep the
    //  HTML parser from seeing a literal script end-tag inside this inline
    //  script when innerHTML rebuilds the doc. JS string escape collapses
    //  the backslashes so the runtime values are unchanged.)
    let lit = fileText.slice(cs, j);
    lit = lit.replace(/<\\\/script/gi, '<\/script');
    lit = lit.replace(/\\\$\{/g, '${');
    lit = lit.replace(/\\`/g, '`');
    lit = lit.replace(/\\\\/g, '\\');

    // `lit` is now the runtime-eval'd INLINE_DOC string; pull the cards out.
    return cardsFromDocString(lit);
  }

  // Extract the kanban-cards JSON array from an already-eval'd document string
  // (the runtime form, where the cards' end-tag is a literal one). Shared by
  // extractDiskCards (raw file text, after escape reversal) and bootReconcile
  // (the in-scope INLINE_DOC const, already a runtime string). The backslash in
  // '<\/script>' below is consumed by the JS string literal at runtime, so this
  // searches for a real script end-tag. (This comment writes it escaped too:
  // a bare end-tag here would prematurely close the script when the runtime
  // re-parses INLINE_DOC via innerHTML — the tokenizer scans comments as well.)
  function cardsFromDocString (docStr) {
    if (typeof docStr !== 'string') return null;
    const open = '<script type="application/json" id="kanban-cards">';
    const ki = docStr.indexOf(open);
    if (ki < 0) return null;
    const ks = ki + open.length;
    const ke = docStr.indexOf('<\/script>', ks);
    if (ke < 0) return null;
    const body = docStr.slice(ks, ke).trim();
    if (!body) return [];
    try { return JSON.parse(body); }
    catch (e) { return null; }
  }

  function eqShallow (a, b) {
    // Deep-equal via JSON.stringify is fine for card data — no
    // functions, no Date objects, no circular refs.
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function mergeDiskIntoBrowser (oldDisk, newDisk, browser) {
    // Three-way merge keyed by card id.
    //   oldDisk:  what was on disk at last sync ("merge base")
    //   newDisk:  what's on disk now
    //   browser:  what's in the DOM (IDB-derived + local drags)
    //
    // Rules:
    //   - Disk added a card (in newDisk, not in oldDisk) → take it
    //   - Disk removed a card (in oldDisk, not in newDisk) → drop it
    //   - Both have it:
    //       For status/claimed_at: if browser changed it locally
    //         (browser != oldDisk on those fields), keep browser's;
    //         else use disk's.
    //       For every other field: use disk's.
    //   - Browser has a card not on disk and not in oldDisk
    //     (shouldn't happen — browser doesn't create cards — but if it
    //     does, keep it).
    const oldMap = new Map((oldDisk || []).map(c => [c.id, c]));
    const newMap = new Map((newDisk || []).map(c => [c.id, c]));
    const brMap  = new Map((browser  || []).map(c => [c.id, c]));

    const allIds = new Set([...newMap.keys(), ...brMap.keys()]);
    const merged = [];
    const addedIds = [];

    for (const id of allIds) {
      const oldC = oldMap.get(id);
      const newC = newMap.get(id);
      const brC  = brMap.get(id);

      // Disk deleted this card (oldDisk had it, newDisk doesn't).
      if (oldC && !newC) {
        // Drop it. (We don't try to detect "user is editing this in
        // browser" — deletes from CLI are deliberate.)
        continue;
      }

      // Disk added a brand-new card.
      if (newC && !oldC) {
        merged.push(newC);
        if (!brC) addedIds.push(id);
        continue;
      }

      // Both have it. Three-way merge per field.
      if (newC && oldC && brC) {
        const result = Object.assign({}, newC);
        // Status: browser change wins if it differs from oldDisk.
        if (brC.status !== oldC.status) {
          result.status = brC.status;
          // A local drag also re-timed the effort clock — carry the
          // browser's effort fields so the drag's timing isn't lost.
          result.effort_seconds = brC.effort_seconds;
          result.effort_started_at = brC.effort_started_at;
        }
        // claimed_at: ditto.
        if (brC.claimed_at !== oldC.claimed_at) result.claimed_at = brC.claimed_at;
        merged.push(result);
        continue;
      }

      // Only in browser (unusual: browser doesn't create cards).
      if (brC && !newC && !oldC) {
        merged.push(brC);
        continue;
      }

      // Anything else (e.g. only in newDisk and oldDisk but not browser):
      // browser somehow dropped it. Take disk's version.
      if (newC) merged.push(newC);
    }

    // Preserve the original disk order roughly: cards on disk first in
    // their disk order, then any browser-only stragglers.
    const finalById = new Map(merged.map(c => [c.id, c]));
    const ordered = [];
    for (const c of (newDisk || [])) {
      const m = finalById.get(c.id);
      if (m) { ordered.push(m); finalById.delete(c.id); }
    }
    for (const c of merged) {
      if (finalById.has(c.id)) { ordered.push(c); finalById.delete(c.id); }
    }
    return { merged: ordered, addedIds };
  }

  // ─── boot reconciliation: file → browser on every page load ──────────
  // The runtime renders from IDB and only falls back to INLINE_DOC on a
  // container's first-ever open; afterwards IDB wins and the freshly loaded
  // INLINE_DOC is ignored — so a board the browser has opened before goes
  // stale the moment the CLI writes the file. But INLINE_DOC is captured from
  // the file at load time, so it always holds what `kanban add/move/...` wrote.
  // We read it directly (fetch(location.href) is blocked on file:// in Chrome)
  // and reconcile before the first paint, so a reload adopts the file.
  function bootReconcile () {
    let fileCards = null;
    try {
      fileCards = (typeof INLINE_DOC === 'string') ? cardsFromDocString(INLINE_DOC) : null;
    } catch (e) { fileCards = null; }
    if (!fileCards) {
      // Couldn't read cards out of INLINE_DOC (missing/malformed JSON, or the
      // splicer never injected it). Keep whatever IDB has rather than wiping
      // the board — but say so, or it looks like a silent stale-board bug with
      // no clue why. Mirrors readCards()'s malformed-JSON warning.
      console.warn('kanban: could not parse cards from INLINE_DOC; keeping current board state');
      return;
    }
    const browserCards = readCards();
    lastSeenDisk = fileCards;                 // seed the live-sync baseline
    if (eqShallow(fileCards, browserCards)) return;   // already in sync

    const dragged = getDraggedIds();
    let merged;
    if (dragged.size === 0) {
      // Clean browser: the file is the source of truth. Adopt it wholesale.
      merged = fileCards;
    } else {
      // The browser holds uncommitted local drags. The file owns the card set
      // (the browser never creates cards) and every field — EXCEPT the status,
      // claimed_at, and effort clock of the specific cards the user dragged,
      // where the local drag wins (the documented same-card conflict policy).
      // So CLI adds, deletes, notes, and moves of OTHER cards all come through,
      // while the human's in-flight drags survive the reload.
      const brById = new Map(browserCards.map(c => [c.id, c]));
      merged = fileCards.map(fc => {
        const bc = brById.get(fc.id);
        if (!bc || !dragged.has(fc.id)) return fc;
        return Object.assign({}, fc, { status: bc.status, claimed_at: bc.claimed_at,
                                       effort_seconds: bc.effort_seconds, effort_started_at: bc.effort_started_at });
      });
    }
    if (eqShallow(merged, browserCards)) return;
    writeCards(merged);
    persistDocToIdb();   // so ⌘S and the next load see what the user now sees
  }

  // Read one value from an IndexedDB store by key, opening the db read-only and
  // tolerating a missing store/db (returns null). Used to fetch the runtime's
  // stored File System Access handle without depending on runtime internals.
  function idbGetRaw (dbName, store, key) {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open(dbName); }
      catch (e) { return resolve(null); }
      req.onerror = () => resolve(null);
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(store)) { try { db.close(); } catch (_) {} return resolve(null); }
        let out = null;
        try {
          const tx = db.transaction(store, 'readonly');
          const r = tx.objectStore(store).get(key);
          r.onsuccess = () => { out = r.result; };
          tx.oncomplete = () => { try { db.close(); } catch (_) {} resolve(out); };
          tx.onerror = () => { try { db.close(); } catch (_) {} resolve(null); };
        } catch (e) { try { db.close(); } catch (_) {} resolve(null); }
      };
    });
  }

  // Read the file's current bytes WITHOUT fetch(): Chrome rejects fetch() of
  // file:// URLs. Prefer the File System Access handle the runtime stores after
  // the first ⌘S (readable without a prompt only while permission is already
  // granted — i.e. the same session as the commit); fall back to fetch() for
  // boards served over http(s). Returns null when no source is available.
  async function readFreshFileText () {
    try {
      const id = window.runtime && window.runtime.id;
      if (id) {
        const handle = await idbGetRaw('rwa_' + id, 'rwa_fsa', 'self');
        if (handle && typeof handle.queryPermission === 'function') {
          const perm = await handle.queryPermission({ mode: 'read' });
          if (perm === 'granted') {
            const file = await handle.getFile();
            return await file.text();
          }
        }
      }
    } catch (e) { /* fall through to fetch */ }
    // fetch() is rejected for file:// in Chrome — and the browser logs a CORS
    // error to the console on every attempt, regardless of try/catch — so only
    // try it for http(s) boards. On file:// with no usable FSA handle we have
    // no live source; the ↻ button / reload (which re-reads INLINE_DOC via
    // bootReconcile) is the path instead.
    if (location.protocol === 'file:') return null;
    const res = await fetch(window.location.href, { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.text();
  }

  async function syncFromDisk () {
    if (syncInFlight) return;
    if (document.hidden) return;
    syncInFlight = true;
    try {
      let text = null;
      try { text = await readFreshFileText(); }
      catch (e) { text = null; }   // file:// fetch throws → no live source this tick
      if (text == null) return;
      const diskCards = extractDiskCards(text);
      if (!diskCards) return;

      // First successful poll: just record the baseline, nothing to merge.
      // (bootReconcile usually seeds lastSeenDisk already; this is a fallback.)
      if (lastSeenDisk === null) { lastSeenDisk = diskCards; return; }

      // Disk hasn't changed since last poll. Nothing to do.
      if (eqShallow(diskCards, lastSeenDisk)) return;

      const browserCards = readCards();
      const { merged, addedIds } = mergeDiskIntoBrowser(lastSeenDisk, diskCards, browserCards);

      // If the merge result equals what's already in the browser, just
      // advance the baseline — no DOM thrash.
      if (eqShallow(merged, browserCards)) {
        lastSeenDisk = diskCards;
        return;
      }

      writeCards(merged);
      render();
      // Push the merge result back into IDB so commit() and a future reload
      // see what the user sees. Without this, a CLI add visible in the tab
      // would be wiped by the next ⌘S (which reads the stale IDB doc).
      // Don't flag dirty — the polling sync is bringing file state IN, not
      // introducing new browser-only changes.
      persistDocToIdb();
      lastSeenDisk = diskCards;

      // Subtle: flash newly-added cards so the user sees them appear.
      for (const id of addedIds) {
        const el = root.querySelector('.kb-card[data-id="' + cssEscape(id) + '"]');
        if (el) {
          el.classList.add('rwa-frag-pulse');
          setTimeout(() => el.classList.remove('rwa-frag-pulse'), 1600);
        }
      }
    } catch (e) {
      // Network/parse/permission failure: skip. We'll try again next tick.
    } finally {
      syncInFlight = false;
    }
  }

  function cssEscape (s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c.charCodeAt(0).toString(16) + ' ');
  }

  // ─── auto-commit-on-drop (opt-in) ────────────────────────────────────
  // Default is off. Preference is per-board (each file:// URL is its own
  // origin in Chromium, so localStorage is naturally scoped per board).
  // Only meaningful with File System Access — on Firefox/Safari, runtime
  // commit falls back to a Save-As dialog that would prompt on every drop,
  // so we hide the toggle and ignore the preference there.
  const AUTO_COMMIT_KEY = 'kb-auto-commit';

  function autoCommitSupported () {
    try {
      const st = window.runtime && window.runtime.status;
      return Boolean(st && st.fsa);
    } catch (e) { return false; }
  }

  function autoCommitEnabled () {
    if (!autoCommitSupported()) return false;
    try { return localStorage.getItem(AUTO_COMMIT_KEY) === '1'; }
    catch (e) { return false; }
  }

  function setAutoCommit (on) {
    try { localStorage.setItem(AUTO_COMMIT_KEY, on ? '1' : '0'); }
    catch (e) {}
    refreshAutoCommitToggle();
  }

  function refreshAutoCommitToggle () {
    const btn = root.querySelector('#kb-auto-commit-toggle');
    if (!btn) return;
    if (!autoCommitSupported()) { btn.hidden = true; return; }
    const on = autoCommitEnabled();
    btn.hidden = false;
    btn.textContent = on ? 'auto-commit: on' : 'auto-commit: off';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function bindAutoCommitToggle () {
    const btn = root.querySelector('#kb-auto-commit-toggle');
    if (!btn || btn.dataset.bound === '1') return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => setAutoCommit(!autoCommitEnabled()));
  }

  // ─── manual "sync from file" affordance ──────────────────────────────
  // The reliable way to pull CLI writes into the tab on file:// is a reload:
  // it re-parses the file into INLINE_DOC, and bootReconcile() then adopts it.
  // Safe while dirty — bootReconcile preserves the uncommitted drag.
  function bindReloadButton () {
    const btn = root.querySelector('#kb-reload');
    if (!btn || btn.dataset.bound === '1') return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => location.reload());
  }

  // Clear the uncommitted-drag flag whenever the document is committed (⌘S,
  // the commit button, or auto-commit): a commit writes IDB → file, so the
  // browser and file agree and there is no longer an in-flight local drag.
  function subscribeCommit () {
    try {
      if (window.runtime && typeof window.runtime.on === 'function') {
        window.runtime.on('commit', () => clearDraggedIds());
      }
    } catch (e) {}
  }

  // Boot: reconcile the file INTO the browser before the first paint, so a
  // reload / the ↻ button always reflects the latest `kanban` CLI writes,
  // then render and wire up live sync.
  bootReconcile();
  render();
  refreshAutoCommitToggle();
  bindAutoCommitToggle();
  bindReloadButton();
  subscribeCommit();
  // Best-effort live sync while the tab is open. Works after the first ⌘S (via
  // the File System Access handle) or over http(s); on a fresh file:// open it
  // has no source, so the ↻ button / reload are the path until the first commit.
  syncFromDisk();
  setInterval(syncFromDisk, SYNC_POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFromDisk(); });
})();
</script>
